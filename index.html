<script>
var MS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
var TL={EXPENSE_FUND:"من الميزانية",EXPENSE_PERSONAL:"على حسابي",CONTRIB:"مساهمة في الميزانية",DEPOSIT:"إيداع للميزانية"};
var IC={grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/>',people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .6 3.2 2.3 3.5 5"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5Z"/>',auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18"/>',
code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',rf:'<path d="M21 12a9 9 0 11-3-6.7M21 3v5h-5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
function I(n,s,w){s=s||24;return'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>'}
var LOGO='<svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0F5C63"/><circle cx="256" cy="256" r="172" fill="#F2B134"/><circle cx="256" cy="256" r="142" fill="none" stroke="#C98F13" stroke-width="8"/><rect x="176" y="260" width="40" height="70" rx="12" fill="#0F5C63" opacity=".6"/><rect x="236" y="220" width="40" height="110" rx="12" fill="#0F5C63" opacity=".8"/><rect x="296" y="180" width="40" height="150" rx="12" fill="#0F5C63"/></svg>';
var S={token:null,st:null,month:null,tab:0,flt:0,det:true,load:false,anim:true,mode:2};V={};
try{S.token=localStorage.getItem('tk')||null;S.mode=+(localStorage.getItem('th')||2)}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(i){return document.getElementById(i)}
function money(n){return Math.round(Number(n)||0).toLocaleString('en-US')}
function plain(n){return n%1===0?String(Math.round(n)):String(n)}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function mt(m){var p=m.split('-'),i=+p[1];return i>=1&&i<=12?MS[i-1]+' '+p[0]:m}
function toast(m){var t=document.createElement('div');t.className='sn';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},3500)}
function theme(){var d=S.mode==1||(S.mode==2&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dk',d);$('tc').content=d?'#0E1819':'#F3F5F4'}
function setTheme(m){S.mode=m;try{localStorage.setItem('th',m)}catch(e){}theme();render()}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);theme();

var API_URL='https://script.google.com/macros/s/AKfycbz-kSRRzB2kzLDhnjQRe73TXFnnTFxp2Hijd1Ze3pYpVKOTk5fCkNsCewraQUfTkYp8/exec';
function netErr(){var e=new Error('لا يوجد اتصال بالخادم');e.net=true;return e}
function setLoading(b){S.load=b;$('ld').style.display=b?'block':'none';var rf=document.querySelector('.rf');if(rf)rf.classList.toggle('sp',b)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function uid(){return'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function clone(o){return JSON.parse(JSON.stringify(o))}

/* ---------- الاتصال بالخادم (Apps Script doPost). text/plain حتى لا يحتاج preflight ---------- */
async function api(action,p,rid,month){
  if(navigator.onLine===false)throw netErr();
  var body=Object.assign({action:action,token:S.token,month:month||S.month},p||{});
  if(rid)body.requestId=rid;
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var tm=setTimeout(function(){if(ctl)ctl.abort()},30000),t;
  try{
    var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined});
    t=await r.text();
  }catch(x){throw netErr()}finally{clearTimeout(tm)}
  var j;try{j=JSON.parse(t)}catch(x){throw new Error('رد غير صالح من الخادم')}
  if(!j.ok){var er=new Error(j.error||'حدث خطأ');er.code=j.code;throw er}
  return j.data;
}

/* ---------- التخزين المحلي: آخر حالة لكل شهر + طابور العمليات غير المرسلة ---------- */
var Q=[];
function loadQ(){try{Q=JSON.parse(lsGet('q')||'[]')}catch(e){Q=[]}}
function saveQ(){lsSet('q',JSON.stringify(Q))}
function saveState(d){var c=clone(d);delete c.warning;if(c.employees)c.employees.forEach(function(e){delete e.code});lsSet('st_'+c.month,JSON.stringify(c));lsSet('st_last',c.month)}
function loadState(m){try{return JSON.parse(lsGet('st_'+m))}catch(e){return null}}
function loadLast(){var m=lsGet('st_last');return m?loadState(m):null}
function clearAll(){lsDel('q');lsDel('tk');try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('st_')===0)localStorage.removeItem(k)})}catch(e){}}

/* ---------- تطبيق العمليات المعلّقة محلياً (الحالة المعروضة = آخر حالة مؤكدة + الطابور) ---------- */
function applyAll(b){var st=clone(b);Q.forEach(function(op){try{applyOp(st,op)}catch(e){}});return st}
function reapply(){if(S.base)S.st=applyAll(S.base)}
function withTx(st,t,sign){
  if(String(t.date).slice(0,7)!==st.month)return;
  var a=sign*t.amount,d=st.dashboard,pe=0;
  if(sign>0){st.tx.unshift(t);st.tx.sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0})}
  else st.tx=st.tx.filter(function(x){return x.id!==t.id});
  if(t.type==='CONTRIB'){d.contributions+=a;d.remaining+=a;pe=a}
  else if(t.type==='DEPOSIT'){d.deposits+=a;d.remaining+=a}
  else if(t.type==='EXPENSE_FUND'){d.fundExpenses+=a;d.remaining-=a}
  else if(t.type==='EXPENSE_PERSONAL'){d.personalExpenses+=a;pe=a}
  if(pe)d.employees.forEach(function(e){if(e.id===t.employeeId){e.paid+=pe;e.balance+=pe}});
}
function applyOp(st,op){
  var p=op.params,me=st.user,A=op.action;
  if(A==='addTx'){

async function drain(m){
  var last=null;

    var op=Q[0];S.inflight=op.id;
    try{
      last=await api(op.action,clone(op.params),op.id,m);
      Q=Q.filter(function(o){return o.id!==op.id});saveQ();
      if(last.warning)toast(last.warning);

function enqueue(a,p,ok){

    if(a==='editTx')['type','amount','note','date'].forEach(function(k){t.params[k]=p[k]});
    else Q=Q.filter(function(o){return o.id!==t.id});
    saveQ();reapply();closeDlg();render();sync();return;
  }

  if(S.offline||navigator.onLine===false)toast('حُفظت على الجهاز وتُرسل عند رجوع الإنترنت');else if(ok)toast(ok);

      '<div class="acts" style="margin-top:12px"><button class="bb p" onclick="buyDlg(\''+n.id+'\',0)">اشتريه من الميزانية</button><button class="bb" onclick="buyDlg(\''+n.id+'\',1)">اشتريه شخصي</button></div></div>')});
  if(dn.length){h+='<div class="sec">اللي انشترت</div>';
    dn.forEach(function(n,i){h+=A(i,'<div class="panel"><div class="row"><div class="ck">✓</div><div class="g"><b style="font-weight:600">'+esc(n.title)+'</b><div class="cap">اشتراها '+esc(n.boughtByName)+'</div></div>'+(n.boughtDate?'<span class="dp">📅 '+esc(n.boughtDate)+'</span>':'')+'</div></div>')})}
  return h;
}
function addN(){var t=$('nn').value.trim();if(!t)return;var p=t.split(' - ');act('addNeed',{title:p[0].trim(),note:(p.slice(1).join(' - ')).trim()},'تمت الإضافة')}
function buyDlg(id,pe){var n=S.st.needs.filter(function(x){return x.id===id})[0];
  dlg((pe?'اشتريته شخصي: ':'اشتريته من الميزانية: ')+esc(n.title),'<input id="amt" class="inp" inputmode="decimal" placeholder="المبلغ (د.ع)"><div style="font-size:13px;font-weight:600;color:var(--acc)">📅 تاريخ الشراء: '+today()+' (يتسجل تلقائياً)</div>','حفظ',"buySave('"+id+"',"+pe+")")}
function buySave(id,pe){var a=num('amt');if(a)act('buyNeed',{id:id,amount:a,mode:pe?'PERSONAL':'FUND'},'تم تسجيل الشراء')}

function vSet(st){
  var mgr=st.user.role==='manager',h='',i=0;
  if(mgr){h+=A(i++,'<button class="btn f" onclick="empDlg()">＋ ضيف موظف</button>');
    st.employees.forEach(function(e){h+=A(i++,'<div class="panel"><div class="row"><div class="av'+(e.active?'':' off')+'">'+esc(e.name.trim().charAt(0))+'</div><div class="g"><div class="row" style="gap:8px"><b style="font-size:18px;color:var(--'+(e.active?'ink':'mut')+')">'+esc(e.name)+'</b><span class="rc'+(e.role==='manager'?' m':'')+'">'+(e.role==='manager'?'مدير':'موظف')+'</span></div>'+
      '<div class="cap" style="font-size:13px">الوجبة '+e.shift+' · المستحق '+money(e.monthlyDue)+(e.active?'':' · معطّل')+'</div></div><button class="sw'+(e.active?' on':'')+'" onclick="tgEmp(\''+e.id+'\')" aria-label="تفعيل"></button></div>'+
      '<div class="cd"><div class="t" onclick="cp(\''+esc(e.code||'')+'\')"><span>كود الدخول</span><code>'+esc(e.code||'—')+'</code><span>⧉</span></div><button class="btn out s" onclick="rsDlg(\''+e.id+'\')">غيّر الكود</button></div>'+
      '<div class="acts" style="margin-top:8px"><button class="btn soft s" style="flex:1" onclick="sendC(\''+esc(e.code)+'\')">إرسال الكود</button><button class="btn out s" style="flex:1" onclick="empDlg(\''+e.id+'\')">✎ تعديل</button></div></div>')});
    if(st.config)h+=A(i++,'<div class="panel"><div class="sec" style="margin-bottom:10px">دورة الدوام</div><div class="lb">تاريخ يوم عمل الوجبة 1 (مرجع الحساب)</div><div class="dr"><input id="an" type="date" class="inp" value="'+esc(st.config.anchorDate)+'"><button class="btn soft s" onclick="act(\'setConfig\',{anchorDate:$(\'an\').value},\'تم الحفظ\')">حفظ</button></div></div>')}
  h+=A(i++,'<div class="panel"><div class="sec">المظهر</div><div class="th">'+[['فاتح','sun'],['داكن','moon'],['تلقائي','auto']].map(function(x,k){return'<button class="'+(S.mode===k?'on':'')+'" onclick="setTheme('+k+')">'+I(x[1],18)+x[0]+'</button>'}).join('')+'</div></div>');
  h+=A(i++,'<a class="panel dev" href="https://wa.me/9647814978377" target="_blank" rel="noopener"><div class="c">'+I('code',22)+'</div><div class="g" style="flex:1"><small>المطور</small><b>ايسر ماجد</b></div><span>واتساب 💬</span></a>');
  h+=A(i++,'<button class="lo" onclick="doLogout()">تسجيل خروج</button>');
  return h;
}
function cp(c){if(navigator.clipboard)navigator.clipboard.writeText(c).then(function(){toast('✓ تم النسخ')},function(){toast(c)});else toast(c)}
function sendC(c){var t='كود الدخول لتطبيق مصاريف الصيانة: '+c;if(navigator.share)navigator.share({text:t}).catch(function(){});else cp(t)}
function tgEmp(id){var e=S.st.employees.filter(function(x){return x.id===id})[0];act('updateEmployee',{id:id,name:e.name,shift:e.shift,monthlyDue:e.monthlyDue,active:!e.active})}
function rsDlg(id){var e=S.st.employees.filter(function(x){return x.id===id})[0];dlg('كود جديد لـ '+esc(e.name)+'؟','<p>سيُسجَّل خروجه من كل أجهزته ولن يعمل كوده القديم.</p>','نعم، أنشئ كوداً جديداً',"act('resetCode',{id:'"+id+"'},'تم توليد كود جديد')",1)}
function empDlg(id){var e=id?S.st.employees.filter(function(x){return x.id===id})[0]:null;V.ac=e?e.active:true;
  var b='<input id="en" class="inp" placeholder="الاسم" value="'+esc(e?e.name:'')+'">';
  if(!e)b+='<div class="lb">نوع المستخدم</div><div class="dr">'+ch('ro',[['employee','موظف'],['manager','مدير']],'employee',0,1).replace(/class="cc c/g,'style="flex:1" class="cc c')+'</div>';
  b+='<div class="lb">الوجبة</div><div class="dr">'+ch('sh',[1,2,3,4].map(function(i){return[String(i),String(i)]}),String(e?e.shift:4),0,1).replace(/class="cc c/g,'style="flex:1" class="cc c')+'</div>'+
    '<input id="ed" class="inp" inputmode="decimal" placeholder="المطلوب شهرياً (0 = غير محسوب بالدفع)" value="'+(e?plain(e.monthlyDue):'')+'">';
  if(e)b+='<div class="row" style="justify-content:space-between"><b id="as" style="color:var(--'+(e.active?'grn':'mut')+')">'+(e.active?'فعّال':'معطّل')+'</b><button class="sw'+(e.active?' on':'')+'" onclick="V.ac=!V.ac;this.classList.toggle(\'on\',V.ac);$(\'as\').textContent=V.ac?\'فعّال\':\'معطّل\';$(\'as\').style.color=\'var(--\'+(V.ac?\'grn\':\'mut\')+\')\'"></button></div>';
  if(e)b+='<button type="button" class="btn dng f" style="margin-top:6px" onclick="delEmpDlg(\''+e.id+'\')">🗑 حذف الموظف</button>';
  dlg(e?'تعديل موظف':'موظف جديد',b,'حفظ',"empSave('"+(id||'')+"')")}
function delEmpDlg(id){var e=S.st.employees.filter(function(x){return x.id===id})[0];
  dlg('حذف '+esc(e.name)+'؟','<p>يُحذف الموظف نهائياً ولا يمكن التراجع. حركاته السابقة تبقى في السجل.</p><div class="lb">اكتب كلمة «حذف» للتأكيد</div><input id="dc" class="inp" placeholder="حذف" autocomplete="off">','حذف نهائي',"delEmpGo('"+id+"')",1)}
function delEmpGo(id){if($('dc').value.trim()!=='حذف'){toast('اكتب كلمة حذف للتأكيد');return}act('deleteEmployee',{id:id},'تم حذف الموظف')}
function empSave(id){var n=$('en').value.trim();if(!n)return;var p={name:n,shift:+V.sh,monthlyDue:parseFloat($('ed').value.replace(/[^0-9.]/g,''))||0};
  if(id){p.id=id;p.active=V.ac;act('updateEmployee',p,'تم الحفظ')}else{p.role=V.ro;act('addEmployee',p,'تمت إضافة الموظف، انسخ كوده وأرسله له')}}

function dlg(title,body,ok,fn,danger){closeDlg();var m=document.createElement('div');m.className='mod';m.id='md';
  m.innerHTML='<div class="dlg"><h2>'+title+'</h2><div class="bd">'+body+'</div><div class="ft"><button class="btn'+(danger?' dsol':'')+'" onclick="'+fn.replace(/"/g,'&quot;')+'">'+ok+'</button><button class="btn out" onclick="closeDlg()">إلغاء</button></div></div>';
  m.addEventListener('mousedown',function(e){if(e.target===m)closeDlg()});document.body.appendChild(m)}
function closeDlg(){var m=$('md');if(m)m.remove();if(S.pend&&!$('md')&&!S.busy){S.pend=false;render()}}
document.addEventListener('focusout',function(){setTimeout(function(){var ae=document.activeElement;if(S.pend&&!$('md')&&!(ae&&ae.tagName==='INPUT')){S.pend=false;render()}},250)});

loadQ();
if(S.token){
  var j0=loadLast();if(j0){S.base=j0;S.st=applyAll(j0);S.month=S.want=j0.month}
  render();sync();
}else{clearAll();render()}
window.addEventListener('online',function(){if(S.token)sync()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.token&&(S.offline||Q.length)&&!syncP)sync()});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
